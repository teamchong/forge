# Pagination: a cursor, page numbers with a total, and offsets. Without
# iterate, the call reads the first page; with it, every item of every page.

- name: a paginated call without iterate reads the first page
  call:
    group: projects
    method: list
    request: { orgId: o1, limit: 2 }
  exchanges:
    - expect:
        method: GET
        path: /orgs/o1/projects
        query: { limit: '2' }
      respond:
        status: 200
        body:
          data:
            - { id: p1, display_name: One, created_at: '2024-03-01T10:00:00Z' }
            - { id: p2, display_name: Two, created_at: '2024-03-02T10:00:00Z' }
          next_cursor: c2
  result:
    response:
      data:
        - { id: p1, displayName: One, createdAt: { $datetime: '2024-03-01T10:00:00Z' } }
        - { id: p2, displayName: Two, createdAt: { $datetime: '2024-03-02T10:00:00Z' } }
      nextCursor: c2

- name: a cursor is followed until it is null
  call:
    group: projects
    method: list
    request: { orgId: o1, limit: 2 }
    iterate: true
  exchanges:
    - expect:
        method: GET
        path: /orgs/o1/projects
        query: { limit: '2' }
      respond:
        status: 200
        body:
          data:
            - { id: p1, display_name: One, created_at: '2024-03-01T10:00:00Z' }
            - { id: p2, display_name: Two, created_at: '2024-03-02T10:00:00Z' }
          next_cursor: c2
    - expect:
        method: GET
        path: /orgs/o1/projects
        query: { limit: '2', cursor: c2 }
      respond:
        status: 200
        body:
          data:
            - { id: p3, display_name: Three, created_at: '2024-03-03T10:00:00Z' }
          next_cursor: null
  result:
    response:
      - { id: p1, displayName: One, createdAt: { $datetime: '2024-03-01T10:00:00Z' } }
      - { id: p2, displayName: Two, createdAt: { $datetime: '2024-03-02T10:00:00Z' } }
      - { id: p3, displayName: Three, createdAt: { $datetime: '2024-03-03T10:00:00Z' } }

- name: iteration stops when the next cursor is the one just sent
  call:
    group: projects
    method: list
    request: { orgId: o1 }
    iterate: true
  exchanges:
    - expect: { method: GET, path: /orgs/o1/projects }
      respond:
        status: 200
        body:
          data: [{ id: p1, display_name: One, created_at: '2024-03-01T10:00:00Z' }]
          next_cursor: c2
    - expect:
        method: GET
        path: /orgs/o1/projects
        query: { cursor: c2 }
      respond:
        status: 200
        body:
          data: [{ id: p2, display_name: Two, created_at: '2024-03-02T10:00:00Z' }]
          next_cursor: c2
  result:
    response:
      - { id: p1, displayName: One, createdAt: { $datetime: '2024-03-01T10:00:00Z' } }
      - { id: p2, displayName: Two, createdAt: { $datetime: '2024-03-02T10:00:00Z' } }

- name: page numbers are followed up to the total
  call:
    group: projects.members
    method: list
    request: { orgId: o1, projectId: p1, perPage: 2 }
    iterate: true
  exchanges:
    - expect:
        method: GET
        path: /orgs/o1/projects/p1/members
        query: { per_page: '2' }
      respond:
        status: 200
        body:
          data: [{ user_id: u1, role: admin }, { user_id: u2, role: viewer }]
          meta: { page: 1, per_page: 2, total_pages: 2 }
    - expect:
        method: GET
        path: /orgs/o1/projects/p1/members
        query: { per_page: '2', page: '2' }
      respond:
        status: 200
        body:
          data: [{ user_id: u3, role: viewer }]
          meta: { page: 2, per_page: 2, total_pages: 2 }
  result:
    response:
      - { userId: u1, role: admin }
      - { userId: u2, role: viewer }
      - { userId: u3, role: viewer }

- name: offsets are followed up to the total
  call:
    group: events
    method: list
    request: { limit: 2 }
    iterate: true
  exchanges:
    - expect:
        method: GET
        path: /events
        query: { limit: '2' }
      respond:
        status: 200
        body:
          data:
            - { id: e1, starts_at: '2024-03-01T10:00:00Z', day: '2024-03-01', payload: '', sequence: 1 }
            - { id: e2, starts_at: '2024-03-02T10:00:00Z', day: '2024-03-02', payload: '', sequence: 2 }
          total: 3
    - expect:
        method: GET
        path: /events
        query: { limit: '2', offset: '2' }
      respond:
        status: 200
        body:
          data:
            - { id: e3, starts_at: '2024-03-03T10:00:00Z', day: '2024-03-03', payload: '', sequence: 3 }
          total: 3
  result:
    response:
      - id: e1
        startsAt: { $datetime: '2024-03-01T10:00:00Z' }
        day: { $date: '2024-03-01' }
        payload: { $bytes: '' }
        sequence: { $int64: '1' }
      - id: e2
        startsAt: { $datetime: '2024-03-02T10:00:00Z' }
        day: { $date: '2024-03-02' }
        payload: { $bytes: '' }
        sequence: { $int64: '2' }
      - id: e3
        startsAt: { $datetime: '2024-03-03T10:00:00Z' }
        day: { $date: '2024-03-03' }
        payload: { $bytes: '' }
        sequence: { $int64: '3' }

- name: every page is fetched with the options of the call
  call:
    group: projects
    method: list
    request: { orgId: o1 }
    options:
      headers: { x-request-id: req-1 }
    iterate: true
  exchanges:
    - expect:
        method: GET
        path: /orgs/o1/projects
        headers: { x-request-id: req-1 }
      respond:
        status: 200
        body:
          data: [{ id: p1, display_name: One, created_at: '2024-03-01T10:00:00Z' }]
          next_cursor: c2
    - expect:
        method: GET
        path: /orgs/o1/projects
        query: { cursor: c2 }
        headers: { x-request-id: req-1 }
      respond:
        status: 200
        body:
          data: []
          next_cursor: null
  result:
    response:
      - { id: p1, displayName: One, createdAt: { $datetime: '2024-03-01T10:00:00Z' } }
